# EXAMPLE caller — copy to a repo as .github/workflows/nox-remediate.yml.
# Replaces dependabot: weekly (and on-demand) OSV dependency upgrades plus
# GitHub Actions pin bumps, opened as one PR and auto-merged when CI is green.
name: Nox Remediate

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate:
    uses: felixgeelhaar/.github/.github/workflows/nox-remediate.yml@main
    secrets: inherit # pass NOX_TOKEN through if the repo/org defines one
