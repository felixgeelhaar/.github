# EXAMPLE caller — copy to a repo as .github/workflows/nox-remediate.yml.
# Replaces dependabot: weekly (and on-demand) OSV dependency upgrades plus
# GitHub Actions pin bumps, opened as one PR and auto-merged when CI is green.
name: Nox Remediate

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate:
    uses: felixgeelhaar/.github/.github/workflows/nox-remediate.yml@main
    secrets: inherit # pass NOX_TOKEN through if the repo/org defines one
    # with:
    #   # Also upgrade dependencies that are merely out of date, not just the
    #   # vulnerable ones. Off by default: it reaches the network, and routine
    #   # churn carries its own risk of breaking a build. A run that only
    #   # freshens is titled `chore(deps): dependency currency pass`, never a
    #   # security remediation.
    #   include-outdated: true
