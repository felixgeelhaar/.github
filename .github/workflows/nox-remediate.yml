# Reusable Nox Remediate — dependency + GitHub Actions remediation in one place.
#
# Replaces dependabot org-wide. nox scans for OSV-vulnerable dependencies AND
# outdated / mutable GitHub Actions pins, applies the fixes, and opens a single
# PR; the caller's auto-merge lands it once CI is green.
#
# Call it from a repo with a thin wrapper (see nox-remediate-caller-example.yml):
#
#   on:
#     schedule:
#       - cron: "17 6 * * 1"
#     workflow_dispatch: {}
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     remediate:
#       uses: felixgeelhaar/.github/.github/workflows/nox-remediate.yml@main
#       secrets: inherit
#
# Bump nox-version / nox-sha256 here once; every caller picks it up.
on:
  workflow_call:
    inputs:
      nox-version:
        description: "nox release version (no leading v)."
        type: string
        default: "1.7.1"
      nox-sha256:
        description: "sha256 of nox_<version>_linux_amd64.tar.gz (verify on bump)."
        type: string
        default: "3106ab3ce7197f43a45fc1128ea27112686421e8ec3eac9be356d4ca42ab4c89"
      include-major:
        description: "Allow major-version action bumps (off by default; majors are surfaced but held)."
        type: boolean
        default: false
    secrets:
      NOX_TOKEN:
        description: "PAT with contents+pull-requests+workflows write. Required to push remediation of .github/workflows/* (the default GITHUB_TOKEN can't). Falls back to GITHUB_TOKEN for dependency-only remediation."
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nox-remediate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # The default GITHUB_TOKEN cannot push changes to .github/workflows/*
          # (GitHub blocks it without the `workflows` scope), and remediating
          # action pins edits workflow files. NOX_TOKEN (org/repo secret, flows in
          # via `secrets: inherit`) is a PAT with that scope.
          #
          # The GITHUB_TOKEN fallback is NOT sufficient for dependency-only
          # remediation, as this comment used to claim. Opening the PR also fails
          # under it unless "Allow GitHub Actions to create and approve pull
          # requests" is enabled on the repo — and that setting additionally lets
          # workflows approve PRs, which defeats a required-review rule. Prefer
          # NOX_TOKEN. The PR step below reports precisely which of the two is
          # missing rather than failing on a bare GraphQL error.
          token: ${{ secrets.NOX_TOKEN || github.token }}
          persist-credentials: true

      # Toolchains for the dependency-tidy step (only used when a manifest is
      # present). Go via the repo's go.mod; node fixed at 22.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install nox (pinned + sha256-verified)
        env:
          NOX_VERSION: ${{ inputs.nox-version }}
          NOX_SHA256: ${{ inputs.nox-sha256 }}
        run: |
          url="https://github.com/nox-hq/nox/releases/download/v${NOX_VERSION}/nox_${NOX_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o nox.tgz
          echo "${NOX_SHA256}  nox.tgz" | sha256sum -c -
          sudo tar xzf nox.tgz -C /usr/local/bin nox
          rm nox.tgz

      - name: Scan + remediate (dependencies + GitHub Actions pins)
        env:
          GITHUB_TOKEN: ${{ secrets.NOX_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_MAJOR: ${{ inputs.include-major }}
        run: |
          nox scan . -format json -output . || true
          # --actions bumps outdated action pins AND SHA-pins mutable tag refs;
          # the deps pass upgrades any OSV-vulnerable go/npm/pypi/cargo package
          # with a fixed_in version. Default nox fix behaviour is unchanged.
          major=""
          [ "$INCLUDE_MAJOR" = "true" ] && major="--include-major"
          nox fix --actions $major --input findings.json --root . || true
          [ -f go.mod ] && go mod tidy || true

      - name: Open remediation PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.NOX_TOKEN || github.token }}
          # Presence only — the value is never echoed.
          NOX_TOKEN_PRESENT: ${{ secrets.NOX_TOKEN != '' && 'yes' || '' }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "nox: nothing to remediate."
            exit 0
          fi
          branch="nox/remediate-${{ github.run_id }}"
          git config user.name "nox-remediate"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(security): nox remediation (deps + actions)"
          git push -u origin "$branch"

          # The branch is pushed before the PR is opened, so a failure here
          # strands the remediation on a branch nobody is told about rather
          # than losing it. roady accumulated one such branch for a week: the
          # scheduled job had reported "failure" every Monday, and the only
          # clue was a GraphQL error in the log of a job nobody watches.
          body="Automated remediation by \`nox fix --actions\`: OSV-vulnerable dependency upgrades plus outdated and mutable GitHub Actions pins bumped to their SHA-pinned latest release. Replaces dependabot."

          # The 'dependencies' label is cosmetic and must never cost us a
          # security remediation. It went missing across the fleet when
          # dependabot was removed — dependabot created it, nox inherited the
          # dependency on it — and govee-light-management then failed every
          # Monday from 2026-07-13 with "could not add label: not found",
          # four weeks of remediation stranded on unreferenced branches.
          #
          # Labels are issues-scoped, so the default GITHUB_TOKEN (contents +
          # pull-requests only) cannot create one. Try anyway for the
          # NOX_TOKEN case, then fall back to an unlabelled PR. Broadening
          # permissions to issues:write for a label would be the wrong trade
          # in a security workflow.
          gh label create dependencies --color 0366d6 \
            --description "Pull requests that update a dependency file" \
            >/dev/null 2>&1 || true

          if ! url="$(gh pr create --title "chore(security): nox remediation" \
            --body "$body" --label dependencies 2>&1)"; then
            label_error="$url"
            # gh validates labels before opening anything, so no PR exists yet
            # and this retry cannot duplicate one. Guard regardless.
            if existing="$(gh pr view "$branch" --json url --jq .url 2>/dev/null)" \
               && [ -n "$existing" ]; then
              url="$existing"
            elif url="$(gh pr create --title "chore(security): nox remediation" \
              --body "$body" 2>&1)"; then
              echo "::warning::Opened without the 'dependencies' label."
              echo "  gh said: $label_error"
              echo "  Fix once per repo:  gh label create dependencies --color 0366d6 \\"
              echo "                        --description 'Pull requests that update a dependency file'"
            else
              echo "::error::Remediation is ready on branch '$branch' but the PR could not be opened."
              echo "  gh said (with label):    $label_error"
              echo "  gh said (without label): $url"
              echo "  Possible causes, most specific first:"
              echo "    - a branch protection or ruleset on the base branch rejecting the PR"
              if [ -z "${NOX_TOKEN_PRESENT}" ]; then
                echo "    - no NOX_TOKEN secret, so this ran as GITHUB_TOKEN, which may not be"
                echo "      permitted to create pull requests in this repo's Actions settings."
                echo "      Fix: add a NOX_TOKEN secret — a PAT with contents:write,"
                echo "      pull-requests:write, workflows:write."
              else
                echo "    - NOX_TOKEN is set, so this is not a missing-secret problem;"
                echo "      check the token's scopes and expiry."
              fi
              echo "  Read the two gh messages above before acting on any of these."
              echo "  Meanwhile the work is not lost — open it by hand:"
              echo "  ${{ github.server_url }}/${{ github.repository }}/compare/$branch?expand=1"
              exit 1
            fi
          fi
          # Auto-merge once CI is green (same flow dependabot PRs used).
          #
          # Arming it can fail in ways that leave the PR open and unattended
          # indefinitely: auto-merge disabled in repo settings, or a base
          # branch with no required checks, leaving nothing for auto-merge to
          # wait on. Both were swallowed by a bare `|| true` — which is how
          # orbita accumulated four ready remediation PRs from Jul 13 onward
          # that nobody was told about. A swallowed failure here parks
          # security work forever; say so instead.
          # $url was captured with 2>&1 so a failure message could be reported,
          # which also means a *successful* create brings gh's warnings along
          # with it. felixgeelhaar/specular hit this immediately:
          #
          #   gh said: invalid qualified head ref format 'Warning: 2 uncommitted
          #   changes\nhttps://github.com/felixgeelhaar/specular/pull/46'
          #
          # so every PR opened since that capture was introduced has failed to
          # arm auto-merge and waited for a human — the exact outcome the
          # reporting above exists to prevent. Extract the URL rather than
          # trusting the whole captured blob to be one.
          url="$(printf '%s\n' "$url" | grep -oE 'https://[^[:space:]]+/pull/[0-9]+' | tail -1)"
          if [ -z "$url" ]; then
            echo "::error::PR was created but its URL could not be parsed from gh's output; cannot arm auto-merge."
            exit 1
          fi

          if ! merge_out="$(gh pr merge --auto --squash "$url" 2>&1)"; then
            echo "::warning::Opened $url but could not arm auto-merge — it will wait for a human."
            echo "  gh said: $merge_out"
            echo "  Common causes:"
            echo "    - auto-merge disabled: Settings > General > Allow auto-merge"
            echo "    - base branch has no required checks, so there is nothing to wait on"
            echo "    - a required review the bot cannot supply itself"
          fi
