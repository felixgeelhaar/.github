# Reusable Go CI — the felixgeelhaar engineering bar in one place.
#
# Enforces, on every PR and push to main: formatting, golangci-lint, race
# tests, an optional coverage gate, and a nox security scan (SARIF -> code
# scanning) with source-to-sink taint SAST. Cost-aware by default:
# concurrency-cancel (set in the caller), setup-go cache, docs-only paths
# ignored, and the macOS/Windows matrix runs only on push-to-main.
#
# Call it from a repo with a thin wrapper (.github/workflows/ci.yml):
#
#   jobs:
#     ci:
#       uses: felixgeelhaar/.github/.github/workflows/go-ci.yml@main
#       permissions:
#         contents: read
#         security-events: write
#       secrets: inherit
#
# Bump pinned action/tool versions here once; every caller picks it up.
on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version. Empty (default) auto-detects from the repo's go.mod."
        type: string
        default: ""
      working-directory:
        description: "Path to the Go module when it is NOT at the repo root (monorepos, e.g. apps/api). Go commands, golangci-lint, coverctl, and the nox scan all target it. Defaults to the repo root."
        type: string
        default: "."
      golangci-version:
        type: string
        default: "v2.12.2"
      nox-strict:
        description: "Fail on net-new critical/high even before a baseline exists. Default: gate only once a baseline is committed."
        type: boolean
        default: false
      coverage:
        description: "Run the coverctl coverage gate. OFF by default for personal repos (opt in per repo that has a coverctl threshold configured)."
        type: boolean
        default: false
      cross-platform:
        description: "Add macOS + Windows to the test matrix on push-to-main. Off by default to save minutes; opt in for repos with OS-specific code (file paths, syscalls, terminal handling)."
        type: boolean
        default: false
      benchmark:
        description: "Run go test -bench on push-to-main only (off by default to save minutes)."
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    strategy:
      fail-fast: false
      matrix:
        # PRs: ubuntu only (macOS = 10x, Windows = 2x runner cost).
        # Push to main: full matrix when cross-platform is enabled.
        os: ${{ (github.event_name != 'pull_request' && inputs.cross-platform) && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && format('{0}/go.mod', inputs.working-directory) || '' }}
          cache: true
          cache-dependency-path: ${{ format('{0}/go.sum', inputs.working-directory) }}
      - run: go mod download
      - run: go mod verify
      - name: Test (race + coverage)
        shell: bash
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage gate
        if: inputs.coverage && runner.os == 'Linux'
        run: |
          go install go.klarlabs.de/coverctl@latest
          coverctl check --profile=coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && format('{0}/go.mod', inputs.working-directory) || '' }}
          cache: true
          cache-dependency-path: ${{ format('{0}/go.sum', inputs.working-directory) }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: ${{ inputs.golangci-version }}
          args: --timeout=5m ./...
          working-directory: ${{ inputs.working-directory }}

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && format('{0}/go.mod', inputs.working-directory) || '' }}
          cache: true
          cache-dependency-path: ${{ format('{0}/go.sum', inputs.working-directory) }}
      - run: go build -v ./...

  # The scan, gate and nox pin live in ONE place for the whole fleet:
  # klarlabs-studio/.github's nox.yml, kept current by its nox-pin.sh. This
  # copy used to pin its own nox and drifted to 1.7.1.
  security:
    name: Security (nox)
    permissions:
      contents: read
      security-events: write
      pull-requests: write   # nox annotate
    uses: klarlabs-studio/.github/.github/workflows/nox.yml@main
    with:
      working-directory: ${{ inputs.working-directory }}
      nox-strict: ${{ inputs.nox-strict }}

  benchmark:
    name: Benchmark
    if: github.event_name != 'pull_request' && inputs.benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && format('{0}/go.mod', inputs.working-directory) || '' }}
          cache: true
          cache-dependency-path: ${{ format('{0}/go.sum', inputs.working-directory) }}
      - run: go test -bench=. -benchmem -run=^$ ./...
