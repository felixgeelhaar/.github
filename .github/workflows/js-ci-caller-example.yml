# EXAMPLE caller — copy to a Node repo as .github/workflows/ci.yml.
# For repos that don't already have a richer bespoke CI. Repos with extra
# required jobs (E2E, CodeQL, cross-platform) keep their own ci.yml and only
# adopt nox-remediate.yml separately.
#
# This file lives in the org .github repo purely as a reference template,
# so it is gated to workflow_dispatch only — the .github repo ships no
# Node project, and auto-running js-ci.yml here fails at the dependency
# cache step ("no package-lock.json"). When you COPY this into a real Node
# repo, replace the `on:` block below with the push/pull_request triggers:
#
#   on:
#     push:
#       branches: [main]
#       paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]
#     pull_request:
#       branches: [main]
#       paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]
name: CI

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: felixgeelhaar/.github/.github/workflows/js-ci.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    secrets: inherit
    with:
      package-manager: npm # npm (default) | pnpm | yarn
