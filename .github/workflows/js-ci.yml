# Reusable JS/TS CI — the felixgeelhaar bar for Node projects.
#
# Auto-adapts to each repo: runs lint / typecheck / test / build only when
# that npm script exists (handles the typecheck vs type-check naming split),
# and a nox security scan (npm dependency CVEs + secrets, the single
# dependency-CVE source of truth). Cost-aware: one install, dependency cache,
# concurrency-cancel (set in the caller), docs-only paths ignored.
#
# Call it from a repo with a thin wrapper (.github/workflows/ci.yml):
#
#   jobs:
#     ci:
#       uses: felixgeelhaar/.github/.github/workflows/js-ci.yml@main
#       permissions:
#         contents: read
#         security-events: write
#       secrets: inherit
#       with:
#         package-manager: pnpm     # npm (default) | pnpm | yarn
#
# Bump pinned action/tool versions here once; every caller picks it up.
on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version."
        type: string
        default: "22"
      package-manager:
        description: "npm (default) | pnpm | yarn. Drives install + cache + run."
        type: string
        default: "npm"
      working-directory:
        description: "Path to the package when it is NOT at the repo root (monorepos)."
        type: string
        default: "."
      nox-strict:
        description: "Fail on net-new critical/high even before a baseline exists."
        type: boolean
        default: false
      run-build:
        description: "Run the build script. Set false for repos whose build needs setup the reusable doesn't do (e.g. sub-project installs in a monorepo) and is handled in the repo's own integration workflow instead."
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    # No job-level permissions here: a reusable job cannot request more than
    # the caller granted (that's a startup_failure). The token inherits the
    # caller job's permissions.
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.package-manager == 'pnpm' && format('{0}/pnpm-lock.yaml', inputs.working-directory) || (inputs.package-manager == 'yarn' && format('{0}/yarn.lock', inputs.working-directory) || format('{0}/package-lock.json', inputs.working-directory)) }}
      - name: Install dependencies
        # NODE_AUTH_TOKEN authenticates GitHub Packages for repos whose .npmrc
        # points a private scope at npm.pkg.github.com. Prefer a PACKAGES_READ_TOKEN
        # secret (a read:packages PAT) when present — required for CROSS-repo
        # private/internal packages, which the default GITHUB_TOKEN cannot read.
        # Falls back to GITHUB_TOKEN (fine for same-repo packages / public deps).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.PACKAGE_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            *)    npm ci ;;
          esac
      - name: Detect available scripts
        id: scripts
        run: |
          node -e '
            const s = (require("./package.json").scripts) || {};
            const fs = require("fs");
            const w = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);
            w("lint", !!s.lint);
            w("test", !!s.test);
            w("build", !!s.build);
            const tc = s.typecheck ? "typecheck" : (s["type-check"] ? "type-check" : "");
            w("typecheck_name", tc);
          '
      - name: Lint
        if: steps.scripts.outputs.lint == 'true'
        run: ${{ inputs.package-manager }} run lint
      - name: Typecheck
        if: steps.scripts.outputs.typecheck_name != ''
        run: ${{ inputs.package-manager }} run ${{ steps.scripts.outputs.typecheck_name }}
      - name: Test
        if: steps.scripts.outputs.test == 'true'
        run: ${{ inputs.package-manager }} run test
      - name: Build
        if: inputs.run-build && steps.scripts.outputs.build == 'true'
        run: ${{ inputs.package-manager }} run build

  # The scan, gate and nox pin live in ONE place for the whole fleet:
  # klarlabs-studio/.github's nox.yml, kept current by its nox-pin.sh. This
  # copy used to pin its own nox and drifted to 1.7.1.
  security:
    name: Security (nox)
    permissions:
      contents: read
      security-events: write
      pull-requests: write   # nox annotate
    uses: klarlabs-studio/.github/.github/workflows/nox.yml@main
    with:
      working-directory: ${{ inputs.working-directory }}
      nox-strict: ${{ inputs.nox-strict }}
